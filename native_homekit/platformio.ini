[platformio]
default_envs = esp12f

[env]
platform = espressif8266@2.6.3
framework = arduino

; The HomeKit library was built and tested with the ESP8266 Arduino 2.6.x
; toolchain. Pairing also needs the ESP8266 at 160 MHz.
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    https://github.com/Mixiaoxiao/Arduino-HomeKit-ESP8266.git

build_flags =
    -DVTABLES_IN_FLASH
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH

[env:esp12f]
; PlatformIO calls the ESP-12E board definition the generic ESP-12 module;
; ESP-12F has the same ESP8266 GPIO layout and is compatible with it.
board = esp12e

[env:d1_mini]
; Use this environment only when the ESP-12F is mounted on a Wemos D1 mini
; carrier with its own USB-UART and board wiring.
board = d1_mini
