# Factory configuration: this is what gets pre-flashed onto the boards.
#
# It adds everything the shipped device needs but an adopted device does not:
# the project identity, the dashboard import hook, and the OTA update channel.
# Once a user adopts the device they manage their own builds, so the update
# entity intentionally does not survive adoption.

packages:
  core: !include comelit-default.yaml

esphome:
  # The built-in first check gives up if the network is not up within 60s of boot,
  # and then waits a full update_interval. Measured on real hardware, Wi-Fi came up
  # 43s in -- too close to that limit for a device that ships to users. Check again
  # once the network is actually there.
  on_boot:
    priority: -100
    then:
      - wait_until:
          condition:
            wifi.connected:
      - delay: 5s
      - update.check:
          id: firmware_update
  project:
    name: mansellrace.comelit-intercom
    # Do not edit: the release workflow replaces this exact string with the tag.
    version: dev

# import_full_config makes adoption materialise the whole configuration in the user's
# dashboard instead of a thin wrapper around a package, so every entity is there to be
# renamed or deleted. Requires a ref (@main) on the URL.
dashboard_import:
  package_import_url: github://mansellrace/comelit-esphome/comelit-default.yaml@main
  import_full_config: true

# ESP8266 cannot verify certificates, so verify_ssl must stay false.
#
# GitHub Pages does not support TLS max_fragment_length, so it sends full-size records:
# 4145 bytes for the certificate and 16408 bytes for the firmware body. BearSSL must be
# able to buffer a whole record, so the default 512 byte rx buffer cannot work here --
# it fails the handshake with BR_ERR_TOO_LARGE and the update entity stays unknown.
http_request:
  verify_ssl: false
  tls_buffer_size_rx: 16384

ota:
  - platform: http_request

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    source: https://mansellrace.github.io/comelit-esphome/firmware/comelit-default.manifest.json
    update_interval: 6h
